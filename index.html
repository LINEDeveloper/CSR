<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Event Gallery</title>
  <style>
    /* =========================================
       1. ตั้งค่าพื้นฐาน (Typography & Background)
       ========================================= */
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #050d1a; 
      font-family: 'Prompt', sans-serif; 
    }
    
    /* =========================================
       2. ระบบสไลด์โชว์แบบ Ken Burns
       ========================================= */
    .slide-container { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      z-index: 1;
    }
    .slide-image {
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      opacity: 0; 
      transition: opacity 1.5s ease-in-out;
      transform: scale(1);
    }
    .slide-image.active {
      opacity: 1;
      animation: kenburns 10s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* =========================================
       3. แบนเนอร์ชื่องาน (ตรงกลางด้านบน)
       ========================================= */
    .event-banner {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 37, 64, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 195, 255, 0.4);
      border-radius: 50px;
      padding: 12px 50px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 195, 255, 0.2);
    }
    .event-title {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .event-subtitle {
      margin: 0;
      font-size: 16px;
      font-weight: 300;
      color: #00C3FF;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================================
       4. ป้ายนับจำนวน Live Counter (ขวาบน)
       ========================================= */
    .live-counter {
      position: absolute; 
      top: 45px; 
      right: 50px; 
      background: rgba(10, 37, 64, 0.65);
      padding: 12px 28px; 
      border-radius: 50px; 
      border: 1px solid rgba(0, 195, 255, 0.4); 
      color: white;
      font-size: 22px; 
      z-index: 10; 
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-dot { 
      color: #FF3D00;
      font-size: 16px;
      animation: blink 1.5s infinite; 
    }
    @keyframes blink { 
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .total-number { color: #00C3FF; font-weight: 600; font-size: 26px; }

    /* =========================================
       5. กล่องแคปชั่น Glassmorphism (ซ้ายล่าง)
       ========================================= */
    .glass-box {
      position: absolute; 
      bottom: 50px; 
      left: 50px; 
      max-width: 600px; 
      padding: 30px;
      background: rgba(10, 37, 64, 0.65); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 195, 255, 0.2);
      border-left: 6px solid #00C3FF; 
      border-radius: 16px; 
      color: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6); 
      z-index: 10;
      opacity: 0; 
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
      transform: translateY(20px);
    }
    .glass-box.active { 
      opacity: 1; 
      transform: translateY(0);
    }
    .employee-info { display: flex; align-items: center; margin-bottom: 15px; }
    .profile-pic { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00C3FF; margin-right: 15px; object-fit: cover; }
    .name { font-size: 22px; font-weight: 600; color: #80D8FF; margin: 0; }
    .caption { font-size: 28px; font-weight: 300; line-height: 1.5; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    /* =========================================
       6. ปุ่ม Download & Share
       ========================================= */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .icon-btn {
      background: rgba(0, 195, 255, 0.1); 
      border: 1px solid rgba(0, 195, 255, 0.4);
      color: #00C3FF;
      padding: 8px 20px;
      border-radius: 30px; 
      font-family: 'Prompt', sans-serif;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn:hover {
      background: #00C3FF; 
      color: #050d1a;
      box-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
    }

    /* =========================================
       7. Mobile Responsive (สำหรับหน้าจอมือถือ)
       ========================================= */
    @media screen and (max-width: 768px) {
      .event-banner {
        top: 20px;
        width: 85%;
        padding: 10px 20px;
        border-radius: 30px;
      }
      .event-title { font-size: 18px; }
      .event-subtitle { font-size: 12px; }

      .live-counter {
        top: 100px;
        right: 50%;
        transform: translateX(50%); 
        padding: 8px 20px;
        font-size: 16px;
      }
      .total-number { font-size: 18px; }

      .glass-box {
        bottom: 20px;
        left: 5%;
        width: 90%; 
        max-width: 100%;
        padding: 20px;
        box-sizing: border-box;
        border-left: none; 
        border-bottom: 4px solid #00C3FF; 
      }
      
      .profile-pic { width: 40px; height: 40px; }
      .name { font-size: 16px; }
      .caption { font-size: 18px; line-height: 1.4; margin-top: 5px;}

      .action-buttons {
        justify-content: flex-end; 
        margin-top: 15px;
      }
      .icon-btn {
        font-size: 14px;
        padding: 6px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- รูปภาพพื้นหลัง -->
  <div class="slide-container">
    <img id="mainImage" class="slide-image" src="" alt="Live Slide">
  </div>

  <!-- แบนเนอร์ชื่องาน (ตรงกลางบน) -->
  <div class="event-banner">
    <h1 class="event-title">งานฉลองความสำเร็จองค์กร</h1>
    <p class="event-subtitle">ANNUAL GALA 2024</p>
  </div>

  <!-- ป้ายนับจำนวน (ขวาบน / กลางบนในมือถือ) -->
  <div class="live-counter">
    <span class="live-dot">⬤</span> 
    <span style="font-weight: 600; letter-spacing: 1px;">LIVE</span> 
    <span style="opacity: 0.5; margin: 0 5px;">|</span> 
    Total Photos: <span id="totalCount" class="total-number">0</span>
  </div>

  <!-- กล่องแคปชั่นพนักงาน (ซ้ายล่าง / เต็มขอบล่างในมือถือ) -->
  <div id="captionBox" class="glass-box">
    <div class="employee-info">
      <img id="profilePic" class="profile-pic" src="" alt="Profile">
      <h3 id="employeeName" class="name">กำลังโหลดข้อมูล...</h3>
    </div>
    <p id="captionText" class="caption">รอรับภาพประทับใจจากทุกคน...</p>
    
    <!-- ปุ่ม Download และ Share -->
    <div class="action-buttons">
      <button onclick="downloadImage()" class="icon-btn">💾 เซฟรูป</button>
      <button onclick="shareImage()" class="icon-btn">📤 แชร์ต่อ</button>
    </div>
  </div>

  <!-- =========================================
       8. JavaScript (เชื่อม API & การทำงาน)
       ========================================= -->
  <script>
    const GAS_URL = "ใส่_WEB_APP_URL_ที่นี่"; // ⚠️ วาง URL จาก Google Apps Script ตรงนี้
    let photosQueue = [];
    let currentIndex = 0;

    // ฟังก์ชันดึงข้อมูลจากฐานข้อมูล
    async function fetchPhotos() {
      try {
        let res = await fetch(GAS_URL);
        let data = await res.json();
        
        // อัปเดตตัวเลข
        document.getElementById("totalCount").innerText = data.total;
        
        // อัปเดตคิวรูปภาพ
        if(data.photos && data.photos.length > 0) {
          photosQueue = data.photos;
        }
      } catch (err) { 
        console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", err); 
      }
    }

    // ฟังก์ชันสลับรูปภาพและข้อความ
    function showNextSlide() {
      if (photosQueue.length === 0) return;
      
      const currentPhoto = photosQueue[currentIndex];
      const imgEl = document.getElementById("mainImage");
      const boxEl = document.getElementById("captionBox");

      imgEl.classList.remove("active");
      boxEl.classList.remove("active");

      setTimeout(() => {
        imgEl.src = currentPhoto.imageUrl;
        document.getElementById("profilePic").src = currentPhoto.profilePic || "https://via.placeholder.com/60";
        document.getElementById("employeeName").innerText = currentPhoto.name;
        document.getElementById("captionText").innerText = currentPhoto.caption;
        
        imgEl.classList.add("active");
        boxEl.classList.add("active");

        currentIndex = (currentIndex + 1) % photosQueue.length; 
      }, 1200); 
    }

    // ฟังก์ชันดาวน์โหลดรูปภาพ
    function downloadImage() {
      const imgUrl = document.getElementById("mainImage").src;
      if (!imgUrl) return;
      
      const a = document.createElement("a");
      a.href = imgUrl;
      a.download = "Event_Photo.jpg"; 
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ฟังก์ชันแชร์ภาพ (รองรับ Web Share API บนมือถือ)
    async function shareImage() {
      const imgUrl = document.getElementById("mainImage").src;
      const captionText = document.getElementById("captionText").innerText;
      
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'บรรยากาศงานของเรา',
            text: captionText,
            url: imgUrl
          });
        } catch (err) {
          console.log("การแชร์ถูกยกเลิก หรือเกิดข้อผิดพลาด:", err);
        }
      } else {
        alert("เบราว์เซอร์ของคุณไม่รองรับฟีเจอร์แชร์โดยตรง สามารถกด 'เซฟรูป' แทนได้ครับ");
      }
    }

    // เริ่มต้นระบบ
    fetchPhotos(); 
    setInterval(fetchPhotos, 10000); // ดึงข้อมูลจาก Sheets ทุก 10 วินาที
    setInterval(showNextSlide, 7000); // สลับรูปภาพทุก 7 วินาที
  </script>
</body>
</html>
